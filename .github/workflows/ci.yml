name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unit tests
        run: ./gradlew :fictura:testDebugUnitTest
      - name: Build the library and the demo
        run: ./gradlew :fictura:assembleRelease :demo:assembleDebug
      - name: The Maven Central files build (AAR, POM, sources, javadoc)
        run: ./gradlew :fictura:publishToMavenLocal
